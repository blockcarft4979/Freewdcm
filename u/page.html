<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="跳转 Freewd 社区应用" />
    <title>跳转 · Freewd 社区</title>
    <link rel="icon" type="image/png" href="/img/freewd_community_icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4a6cf7;
            --primary-light: #70b9ff;
            --primary-dark: #3b5de7;
            --accent: #f59e0b;
            --text-light: #e8e8f0;
            --text-muted: #b0b0c8;
            --text-dim: #7a7a90;
            --bg-deep: #0a0a0e;
            --bg-card: #16161c;
            --border-light: rgba(255, 255, 255, 0.06);
            --shadow-card: 0 20px 40px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(74, 108, 247, 0.12);
            --radius-box: 1.5rem;
            --radius-btn: 40px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition: all 0.25s ease;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-deep);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 卡片容器 ===== */
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-card);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-box);
            box-shadow: var(--shadow-card);
            padding: 2.5rem 2rem;
            transition: padding 0.2s;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.75rem 1.25rem;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 1.5rem 1rem;
            }
        }

        @media (min-width: 640px) {
            .container {
                padding: 3rem 2.8rem;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 28px;
            }
            .container {
                padding: 1.5rem 2rem;
            }
        }

        /* ===== 图标 ===== */
        .logo-icon {
            font-size: 3.6rem;
            line-height: 1;
            text-align: center;
            margin-bottom: 0.75rem;
            color: var(--primary-light);
            filter: drop-shadow(0 4px 12px rgba(74, 108, 247, 0.3));
        }

        .logo-icon i {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ===== 标题 ===== */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.6rem;
            }
        }
        @media (max-width: 360px) {
            h1 {
                font-size: 1.4rem;
            }
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        .sub-message {
            font-size: 1.05rem;
            color: var(--text-muted);
            text-align: center;
            margin: 0.6rem 0 1.6rem;
            line-height: 1.6;
        }

        /* ===== Loading 动画 ===== */
        .loading-wrap {
            text-align: center;
            color: var(--text-muted);
            font-weight: 400;
            font-size: 1rem;
            margin: 1.2rem 0 0.4rem;
        }

        .loading-dots:after {
            content: '...';
            animation: dotPulse 1.8s infinite;
            display: inline-block;
            width: 1.8em;
            text-align: left;
            letter-spacing: 2px;
        }

        @keyframes dotPulse {
            0%,
            20% {
                content: '...';
                opacity: 0.5;
            }
            40% {
                content: '.';
                opacity: 1;
            }
            60% {
                content: '..';
                opacity: 0.9;
            }
            80%,
            100% {
                content: '...';
                opacity: 0.6;
            }
        }

        /* ===== 微信/QQ 警告框 ===== */
        .wechat-warning {
            background: rgba(245, 158, 11, 0.06);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 1.25rem;
            padding: 1.5rem 1.4rem;
            margin: 0.6rem 0 1.8rem;
            backdrop-filter: blur(4px);
        }

        .wechat-warning h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fbbf24;
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 0.6rem;
            border-bottom: 1px dashed rgba(245, 158, 11, 0.2);
            padding-bottom: 0.6rem;
        }

        .wechat-warning h3 i {
            font-size: 1.3rem;
            color: #fbbf24;
        }

        .wechat-warning>p {
            margin-bottom: 1.2rem;
            color: #d0d0e0;
            font-size: 0.98rem;
        }

        .steps {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .step {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .step-number {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(74, 108, 247, 0.35);
        }

        .step-text {
            flex: 1;
            min-width: 0;
            word-break: break-word;
            color: #e0e0e8;
            font-size: 0.98rem;
            line-height: 1.5;
            padding-top: 2px;
        }

        .step-text strong {
            color: #f0f0f8;
            font-weight: 600;
        }

        @media (max-width: 400px) {
            .step-text {
                font-size: 0.92rem;
            }
            .wechat-warning {
                padding: 1.2rem 1rem;
            }
        }

        /* ===== 按钮组 ===== */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.8rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 0.9rem 1.2rem;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: var(--radius-btn);
            text-decoration: none;
            border: 1px solid transparent;
            transition: var(--transition);
            cursor: pointer;
            background: rgba(30, 35, 44, 0.7);
            color: var(--primary-light);
            border-color: rgba(74, 108, 247, 0.25);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            text-align: center;
            line-height: 1.3;
            word-break: break-word;
            font-family: var(--font-sans);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #fff;
            border: none;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(59, 93, 231, 0.35);
        }

        .btn-primary:hover,
        .btn-primary:active {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 10px 24px rgba(59, 93, 231, 0.5);
        }

        .btn-secondary {
            background: rgba(20, 30, 45, 0.6);
            color: var(--primary-light);
            border-color: rgba(74, 108, 247, 0.35);
        }

        .btn-secondary:hover,
        .btn-secondary:active {
            background: rgba(40, 60, 90, 0.7);
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .btn i {
            font-size: 1.15rem;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
        }

        .btn-primary i {
            color: #fff;
        }
        .btn-secondary i {
            color: var(--primary-light);
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.98rem;
                padding: 0.8rem 1rem;
            }
        }
        @media (max-width: 360px) {
            .btn {
                font-size: 0.92rem;
                padding: 0.7rem 0.8rem;
            }
        }
        @media (min-width: 640px) {
            .btn {
                padding: 1rem 1.8rem;
            }
        }

        /* ===== 淡入动画 ===== */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== 隐藏辅助 ===== */
        .hidden {
            display: none !important;
        }

        /* ===== 复制成功反馈 ===== */
        .copy-success {
            color: #4ade80 !important;
        }
        .copy-success i {
            color: #4ade80 !important;
        }

        /* ===== 响应式微调 ===== */
        @media (prefers-reduced-motion: reduce) {
            .fade-in {
                opacity: 1;
                transform: translateY(0);
                transition: none;
            }
            .loading-dots:after {
                animation: none;
                content: '...';
            }
        }
    </style>
</head>

<body>

    <div class="container" id="appContainer">

        <!-- 图标 -->
        <div class="logo-icon fade-in visible">
            <i class="fas fa-rocket"></i>
        </div>

        <!-- 标题 -->
        <h1 class="fade-in visible">
            前往 <span class="gradient-text">Freewd</span> 社区
        </h1>

        <!-- ===== 微信/QQ 警告（默认隐藏） ===== -->
        <div id="wechatWarning" class="wechat-warning hidden fade-in">
            <h3>
                <i class="fas fa-exclamation-triangle"></i>
                检测到 QQ / 微信内打开
            </h3>
            <p>由于内置浏览器限制，请按以下步骤用系统浏览器打开：</p>
            <div class="steps">
                <div class="step">
                    <div class="step-number">1</div>
                    <span class="step-text">点击右上角 “<strong>···</strong>” 或 “<strong>⋮</strong>” 菜单</span>
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    <span class="step-text">选择 “<strong>在浏览器中打开</strong>”</span>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <span class="step-text">在浏览器中继续访问此页面，即可自动跳转 Freewd 应用</span>
                </div>
            </div>
            <div style="margin-top: 1.5rem; text-align: center;">
                <button id="copyLinkInside" class="btn btn-secondary" style="display: inline-flex; width: auto; padding: 0.6rem 1.8rem;">
                    <i class="fas fa-copy"></i> 复制链接
                </button>
            </div>
        </div>

        <!-- ===== 正常视图（默认显示） ===== -->
        <div id="normalView" class="fade-in visible">
            <p class="sub-message">正在为您跳转 Freewd 社区应用</p>
            <div class="loading-wrap">
                <span class="loading-dots">正在准备打开应用</span>
            </div>
        </div>

        <!-- ===== 操作按钮（默认隐藏） ===== -->
        <div id="actionButtons" class="buttons hidden">
            <a href="#" id="openAppBtn" class="btn btn-primary">
                <i class="fas fa-external-link-alt"></i> 打开 Freewd 应用
            </a>
            <a href="#" id="copyLinkBtn" class="btn btn-secondary">
                <i class="fas fa-copy"></i> 复制链接
            </a>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ----- 工具函数 -----
            function getJumpUrl() {
                const params = new URLSearchParams(window.location.search);
                let filename = params.get('filename');
                if (filename === null || filename === undefined) {
                    filename = params.get('file') || '';
                }
                const zone = params.get('zone') || '1';
                return `freewd://open_post/path?filename=${encodeURIComponent(filename)}&zone=${encodeURIComponent(zone)}`;
            }

            function isWechatOrQQ() {
                const ua = navigator.userAgent.toLowerCase();
                return ua.includes('micromessenger') || ua.includes('qq/');
            }

            async function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                        return true;
                    } catch {
                        return false;
                    }
                } else {
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    textArea.style.position = 'fixed';
                    textArea.style.opacity = '0';
                    textArea.style.left = '-9999px';
                    textArea.style.top = '-9999px';
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        const success = document.execCommand('copy');
                        document.body.removeChild(textArea);
                        return success;
                    } catch {
                        document.body.removeChild(textArea);
                        return false;
                    }
                }
            }

            function showCopySuccess(btnElement, originalHtml) {
                btnElement.innerHTML = '<i class="fas fa-check"></i> 已复制';
                btnElement.classList.add('copy-success');
                setTimeout(() => {
                    btnElement.innerHTML = originalHtml;
                    btnElement.classList.remove('copy-success');
                }, 2000);
            }

            // ----- DOM 元素 -----
            const normalView = document.getElementById('normalView');
            const wechatWarning = document.getElementById('wechatWarning');
            const actionButtons = document.getElementById('actionButtons');
            const openAppBtn = document.getElementById('openAppBtn');
            const copyLinkBtn = document.getElementById('copyLinkBtn');
            const copyLinkInside = document.getElementById('copyLinkInside');

            const currentPageUrl = window.location.href;
            const appUrl = getJumpUrl();

            // 为打开按钮设置跳转地址
            if (openAppBtn) {
                openAppBtn.href = appUrl;
                openAppBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = appUrl;
                });
            }

            // ----- 复制处理 -----
            async function handleCopy(triggerElement) {
                const originalHtml = triggerElement.innerHTML;
                const success = await copyToClipboard(currentPageUrl);
                if (success) {
                    showCopySuccess(triggerElement, originalHtml);
                } else {
                    alert('复制失败，请手动复制链接');
                }
            }

            if (copyLinkBtn) {
                copyLinkBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    handleCopy(this);
                });
            }

            if (copyLinkInside) {
                copyLinkInside.addEventListener('click', function(e) {
                    e.preventDefault();
                    handleCopy(this);
                });
            }

            // ----- 核心逻辑 -----
            document.addEventListener('DOMContentLoaded', function() {
                const inWechat = isWechatOrQQ();

                // 先全部隐藏，再按需显示
                normalView.classList.add('hidden');
                wechatWarning.classList.add('hidden');
                actionButtons.classList.add('hidden');

                // 移除隐藏类以便淡入
                const showWithFade = (el) => {
                    el.classList.remove('hidden');
                    // 如果已经 visible 则不需要重新触发
                    if (!el.classList.contains('visible')) {
                        el.classList.add('visible');
                    }
                };

                if (inWechat) {
                    // 微信/QQ 环境：显示警告 + 复制按钮
                    showWithFade(wechatWarning);
                    showWithFade(actionButtons);
                } else {
                    // 正常环境：先显示 loading，尝试跳转
                    showWithFade(normalView);

                    // 1 秒后尝试跳转
                    setTimeout(() => {
                        window.location.href = appUrl;
                    }, 1000);

                    // 4 秒后如果页面还在（跳转失败），显示操作按钮
                    setTimeout(() => {
                        if (!normalView.classList.contains('hidden')) {
                            normalView.classList.add('hidden');
                            showWithFade(actionButtons);
                        }
                    }, 4000);

                    // 6 秒后备，确保按钮出现
                    setTimeout(() => {
                        if (!normalView.classList.contains('hidden')) {
                            normalView.classList.add('hidden');
                            showWithFade(actionButtons);
                        }
                    }, 6000);
                }

                // 如果页面在后台被唤醒，不做额外处理
                window.addEventListener('blur', function() {});
            });

        })();
    </script>

</body>
</html>
